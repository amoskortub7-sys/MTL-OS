plugins {
    id "com.android.application"
}

android {
    namespace "com.mtl.launcher"
    compileSdk 35

    defaultConfig {
        applicationId "com.mtl.launcher"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "0.1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}